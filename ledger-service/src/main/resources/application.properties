spring.application.name=ledger-service
server.port=${PORT:8081}

# Java 21 virtual threads for request handling
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledger}
spring.datasource.username=${DB_USER:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka: idempotent producer, wait for all in-sync replicas
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

ledger.events.publisher=kafka
ledger.events.topic=ledger.transfer-events
ledger.outbox.poll-interval-ms=1000

# HS256 signing key shared with the notification service (override with JWT_SECRET outside local dev)
ledger.jwt.secret=${JWT_SECRET:change-me-this-is-a-local-dev-secret-of-32+bytes}
ledger.jwt.ttl-minutes=30

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
