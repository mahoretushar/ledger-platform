spring.application.name=api-gateway
server.port=${PORT:8080}
spring.threads.virtual.enabled=true

gateway.ledger-uri=${LEDGER_URI:http://localhost:8081}
gateway.notification-uri=${NOTIFICATION_URI:http://localhost:8082}

# Fail fast instead of letting slow downstreams pile up requests
spring.cloud.gateway.server.webmvc.http-client.connect-timeout=2s
spring.cloud.gateway.server.webmvc.http-client.read-timeout=10s

management.endpoints.web.exposure.include=health,info,metrics,gateway
