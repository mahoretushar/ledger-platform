spring.application.name=notification-service
server.port=${PORT:8082}
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notification}
spring.datasource.username=${DB_USER:notification}
spring.datasource.password=${DB_PASSWORD:notification}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
# pick up partitions added to the topic within 30 s instead of the 5-minute default
spring.kafka.consumer.properties.metadata.max.age.ms=30000

notification.topic=ledger.transfer-events

# Same HS256 key the ledger service signs tokens with
notification.jwt.secret=${JWT_SECRET:change-me-this-is-a-local-dev-secret-of-32+bytes}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
