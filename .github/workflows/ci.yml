name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit and integration tests (PostgreSQL 18, embedded Kafka)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Create notification test database
        env:
          PGPASSWORD: ledger
        run: |
          psql -h localhost -U ledger -d ledger_test -c "CREATE ROLE notification LOGIN PASSWORD 'notification';"
          psql -h localhost -U ledger -d ledger_test -c "CREATE DATABASE notification_test OWNER notification;"
      - name: Build and test all modules
        run: ./mvnw -B verify

  e2e:
    name: End-to-end smoke test (Docker Compose)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start platform
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through the gateway
        run: ./scripts/smoke-test.sh
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop platform
        if: always()
        run: docker compose down -v
